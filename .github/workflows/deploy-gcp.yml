name: Deploy Backend To GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  GCP_REGION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  API_SERVICE: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  WORKER_POOL: ${{ vars.CLOUD_RUN_WORKER_SERVICE }}
  BEAT_POOL: ${{ vars.CLOUD_RUN_BEAT_SERVICE }}
  MIGRATION_JOB: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT || vars.SERVICE_ACCOUNT_EMAIL }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  VPC_CONNECTOR: ${{ vars.CLOUD_RUN_VPC_CONNECTOR }}
  VPC_NETWORK: ${{ vars.CLOUD_RUN_NETWORK || 'trans-vpc' }}
  VPC_SUBNET: ${{ vars.CLOUD_RUN_SUBNET || 'trans-subnet' }}
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  GCS_PREFIX: ${{ vars.GCS_PREFIX || 'prod' }}
  GCS_MOUNT_PATH: /mnt/trans-storage
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
  API_MIN_INSTANCES: ${{ vars.CLOUD_RUN_API_MIN_INSTANCES || '1' }}
  WORKER_INSTANCES: ${{ vars.CLOUD_RUN_WORKER_INSTANCES || vars.CLOUD_RUN_WORKER_MIN_INSTANCES || '1' }}
  BEAT_INSTANCES: ${{ vars.CLOUD_RUN_BEAT_INSTANCES || vars.CLOUD_RUN_BEAT_MIN_INSTANCES || '1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: Set Up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: alpha

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build And Push Image
        id: image
        run: |-
          set -euo pipefail
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/trans-backend:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Cloud Run Resources
        run: |-
          set -euo pipefail

          IMAGE_URI="${{ steps.image.outputs.image_uri }}"

          required_vars=(
            GCP_PROJECT_ID
            GCP_REGION
            API_SERVICE
            WORKER_POOL
            BEAT_POOL
            MIGRATION_JOB
            RUNTIME_SERVICE_ACCOUNT
            GCS_BUCKET
            CORS_ORIGINS
          )
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Missing required GitHub variable: ${var_name}" >&2
              exit 2
            fi
          done

          storage_root="${GCS_MOUNT_PATH}"
          if [[ -n "${GCS_PREFIX:-}" ]]; then
            clean_prefix="${GCS_PREFIX#/}"
            clean_prefix="${clean_prefix%/}"
            storage_root="${storage_root}/${clean_prefix}"
          fi

          secret_vars="DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET:latest,ADMIN_SECRET_KEY=ADMIN_SECRET_KEY:latest,SECRET_KEY=SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          if gcloud secrets describe OPENROUTER_API_KEY --project "${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            secret_vars="${secret_vars},OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          fi

          env_vars_for_role() {
            local role="$1"
            local run_migrations="$2"
            local upload_dir="$3"
            local job_storage_base="$4"
            local legacy_translated_dir="$5"

            printf '^|^APP_ENV=production|ENVIRONMENT=production|APP_RUNTIME_ROLE=%s|RUN_MIGRATIONS=%s|STORAGE_BACKEND=local|UPLOAD_DIR=%s|JOB_STORAGE_BASE=%s|LEGACY_TRANSLATED_DIR=%s|CORS_ORIGINS=%s' \
              "${role}" \
              "${run_migrations}" \
              "${upload_dir}" \
              "${job_storage_base}" \
              "${legacy_translated_dir}" \
              "${CORS_ORIGINS}"
          }

          add_service_connectivity_args() {
            local -n out_args=$1
            if [[ -n "${CLOUD_SQL_INSTANCE:-}" ]]; then
              out_args+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
            fi
            if [[ -n "${VPC_CONNECTOR:-}" ]]; then
              out_args+=(--vpc-connector "${VPC_CONNECTOR}" --vpc-egress private-ranges-only)
            fi
          }

          add_job_connectivity_args() {
            local -n out_args=$1
            if [[ -n "${CLOUD_SQL_INSTANCE:-}" ]]; then
              out_args+=(--set-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
            fi
            if [[ -n "${VPC_CONNECTOR:-}" ]]; then
              out_args+=(--vpc-connector "${VPC_CONNECTOR}" --vpc-egress private-ranges-only)
            fi
          }

          add_worker_pool_connectivity_args() {
            local -n out_args=$1
            if [[ -n "${CLOUD_SQL_INSTANCE:-}" ]]; then
              out_args+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
            fi
            out_args+=(--network "${VPC_NETWORK}" --subnet "${VPC_SUBNET}" --vpc-egress private-ranges-only)
          }

          deploy_migration_job() {
            local env_vars
            env_vars="$(env_vars_for_role migrate true /tmp/trans/uploads /tmp/trans/logs/jobs /tmp/trans/translated_novel)"

            local args=()
            add_job_connectivity_args args

            gcloud run jobs deploy "${MIGRATION_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"

            gcloud run jobs execute "${MIGRATION_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --wait
          }

          deploy_api_service() {
            local env_vars
            env_vars="$(env_vars_for_role api false "${storage_root}/uploads" "${storage_root}/logs/jobs" "${storage_root}/translated_novel")"

            local args=()
            add_service_connectivity_args args

            gcloud run deploy "${API_SERVICE}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --allow-unauthenticated \
              --execution-environment gen2 \
              --min-instances "${API_MIN_INSTANCES}" \
              --add-volume "name=trans-storage,type=cloud-storage,bucket=${GCS_BUCKET},readonly=false" \
              --add-volume-mount "volume=trans-storage,mount-path=${GCS_MOUNT_PATH}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"
          }

          deploy_worker_pool() {
            local pool_name="$1"
            local role="$2"
            local instances="$3"
            local cpu="$4"
            local memory="$5"

            local env_vars
            env_vars="$(env_vars_for_role "${role}" false "${storage_root}/uploads" "${storage_root}/logs/jobs" "${storage_root}/translated_novel")"

            local args=()
            add_worker_pool_connectivity_args args

            gcloud alpha run worker-pools deploy "${pool_name}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --instances "${instances}" \
              --cpu "${cpu}" \
              --memory "${memory}" \
              --add-volume "name=trans-storage,type=cloud-storage,bucket=${GCS_BUCKET},readonly=false" \
              --add-volume-mount "volume=trans-storage,mount-path=${GCS_MOUNT_PATH}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"
          }

          deploy_migration_job
          deploy_api_service
          deploy_worker_pool "${WORKER_POOL}" worker "${WORKER_INSTANCES}" 2 2Gi
          deploy_worker_pool "${BEAT_POOL}" beat "${BEAT_INSTANCES}" 1 1Gi
