name: Deploy Backend To GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  GCP_REGION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  API_SERVICE: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  BACKGROUND_JOB: ${{ vars.CLOUD_RUN_BACKGROUND_JOB || 'trans-background-job' }}
  MIGRATION_JOB: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
  SCHEDULER_JOB: ${{ vars.CLOUD_SCHEDULER_MAINTENANCE_JOB || 'trans-maintenance' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT || vars.SERVICE_ACCOUNT_EMAIL }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  GCS_PREFIX: ${{ vars.GCS_PREFIX || 'prod' }}
  GCS_MOUNT_PATH: /mnt/trans-storage
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
  API_MIN_INSTANCES: ${{ vars.CLOUD_RUN_API_MIN_INSTANCES || '0' }}
  API_MAX_INSTANCES: ${{ vars.CLOUD_RUN_API_MAX_INSTANCES || '3' }}
  BACKGROUND_JOB_TIMEOUT: ${{ vars.CLOUD_RUN_BACKGROUND_JOB_TIMEOUT || '86400s' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: Set Up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: alpha

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build And Push Image
        id: image
        run: |-
          set -euo pipefail
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/trans-backend:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Cloud Run Resources
        run: |-
          set -euo pipefail

          IMAGE_URI="${{ steps.image.outputs.image_uri }}"

          required_vars=(
            GCP_PROJECT_ID
            GCP_REGION
            API_SERVICE
            BACKGROUND_JOB
            MIGRATION_JOB
            SCHEDULER_JOB
            RUNTIME_SERVICE_ACCOUNT
            GCS_BUCKET
            CORS_ORIGINS
          )
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Missing required GitHub variable: ${var_name}" >&2
              exit 2
            fi
          done

          storage_root="${GCS_MOUNT_PATH}"
          if [[ -n "${GCS_PREFIX:-}" ]]; then
            clean_prefix="${GCS_PREFIX#/}"
            clean_prefix="${clean_prefix%/}"
            storage_root="${storage_root}/${clean_prefix}"
          fi

          secret_vars="DATABASE_URL=DATABASE_URL:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET:latest,ADMIN_SECRET_KEY=ADMIN_SECRET_KEY:latest,SECRET_KEY=SECRET_KEY:latest"
          if gcloud secrets describe OPENROUTER_API_KEY --project "${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            secret_vars="${secret_vars},OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          fi

          env_vars_for_role() {
            local role="$1"
            local run_migrations="$2"
            local upload_dir="$3"
            local job_storage_base="$4"
            local legacy_translated_dir="$5"

            printf '^|^APP_ENV=production|ENVIRONMENT=production|APP_RUNTIME_ROLE=%s|RUN_MIGRATIONS=%s|STORAGE_BACKEND=local|UPLOAD_DIR=%s|JOB_STORAGE_BASE=%s|LEGACY_TRANSLATED_DIR=%s|CORS_ORIGINS=%s|BACKGROUND_EXECUTOR=cloud_run|CLOUD_RUN_BACKGROUND_JOB=%s|CLOUD_RUN_JOB_TIMEOUT=%s|GOOGLE_CLOUD_PROJECT=%s|GOOGLE_CLOUD_LOCATION=%s' \
              "${role}" \
              "${run_migrations}" \
              "${upload_dir}" \
              "${job_storage_base}" \
              "${legacy_translated_dir}" \
              "${CORS_ORIGINS}" \
              "${BACKGROUND_JOB}" \
              "${BACKGROUND_JOB_TIMEOUT}" \
              "${GCP_PROJECT_ID}" \
              "${GCP_REGION}"
          }

          add_service_connectivity_args() {
            local -n out_args=$1
            if [[ -n "${CLOUD_SQL_INSTANCE:-}" ]]; then
              out_args+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
            fi
          }

          add_job_connectivity_args() {
            local -n out_args=$1
            if [[ -n "${CLOUD_SQL_INSTANCE:-}" ]]; then
              out_args+=(--set-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
            fi
          }

          clear_job_vpc_connector() {
            local job_name="$1"

            gcloud run jobs update "${job_name}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --clear-vpc-connector
          }

          deploy_migration_job() {
            local env_vars
            env_vars="$(env_vars_for_role migrate true /tmp/trans/uploads /tmp/trans/logs/jobs /tmp/trans/translated_novel)"

            local args=()
            add_job_connectivity_args args

            gcloud run jobs deploy "${MIGRATION_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"

            clear_job_vpc_connector "${MIGRATION_JOB}"

            gcloud run jobs execute "${MIGRATION_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --wait
          }

          deploy_api_service() {
            local env_vars
            env_vars="$(env_vars_for_role api false "${storage_root}/uploads" "${storage_root}/logs/jobs" "${storage_root}/translated_novel")"

            local args=()
            add_service_connectivity_args args

            gcloud run deploy "${API_SERVICE}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --allow-unauthenticated \
              --execution-environment gen2 \
              --min-instances "${API_MIN_INSTANCES}" \
              --max-instances "${API_MAX_INSTANCES}" \
              --add-volume "name=trans-storage,type=cloud-storage,bucket=${GCS_BUCKET},readonly=false" \
              --add-volume-mount "volume=trans-storage,mount-path=${GCS_MOUNT_PATH}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"
          }

          deploy_background_job() {
            local env_vars
            env_vars="$(env_vars_for_role job false "${storage_root}/uploads" "${storage_root}/logs/jobs" "${storage_root}/translated_novel")"

            local args=()
            add_job_connectivity_args args

            gcloud run jobs deploy "${BACKGROUND_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE_URI}" \
              --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout "${BACKGROUND_JOB_TIMEOUT}" \
              --cpu 2 \
              --memory 2Gi \
              --add-volume "name=trans-storage,type=cloud-storage,bucket=${GCS_BUCKET},readonly=false" \
              --add-volume-mount "volume=trans-storage,mount-path=${GCS_MOUNT_PATH}" \
              --set-env-vars "${env_vars}" \
              --set-secrets "${secret_vars}" \
              "${args[@]}"

            clear_job_vpc_connector "${BACKGROUND_JOB}"
          }

          configure_background_iam() {
            gcloud run jobs add-iam-policy-binding "${BACKGROUND_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
              --role "roles/run.jobsExecutorWithOverrides" \
              --quiet

            gcloud run jobs add-iam-policy-binding "${BACKGROUND_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
              --role "roles/run.developer" \
              --quiet
          }

          configure_maintenance_scheduler() {
            if ! gcloud services list \
              --enabled \
              --project "${GCP_PROJECT_ID}" \
              --filter "config.name=cloudscheduler.googleapis.com" \
              --format "value(config.name)" | grep -q '^cloudscheduler.googleapis.com$'; then
              echo "Cloud Scheduler API is not enabled or cannot be checked by this service account; skipping scheduler configuration."
              return 0
            fi

            local run_uri
            run_uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/jobs/${BACKGROUND_JOB}:run"
            local body
            body='{"overrides":{"containerOverrides":[{"env":[{"name":"BACKGROUND_TASK_NAME","value":"backend.background.maintenance.run_maintenance"},{"name":"BACKGROUND_TASK_KIND","value":"maintenance"}]}],"taskCount":1,"timeout":"900s"}}'

            if gcloud scheduler jobs describe "${SCHEDULER_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --location "${GCP_REGION}" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "${SCHEDULER_JOB}" \
                --project "${GCP_PROJECT_ID}" \
                --location "${GCP_REGION}" \
                --schedule "*/5 * * * *" \
                --time-zone "Asia/Seoul" \
                --uri "${run_uri}" \
                --http-method POST \
                --oauth-service-account-email "${RUNTIME_SERVICE_ACCOUNT}" \
                --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
                --headers "Content-Type=application/json" \
                --message-body "${body}"
            else
              gcloud scheduler jobs create http "${SCHEDULER_JOB}" \
                --project "${GCP_PROJECT_ID}" \
                --location "${GCP_REGION}" \
                --schedule "*/5 * * * *" \
                --time-zone "Asia/Seoul" \
                --uri "${run_uri}" \
                --http-method POST \
                --oauth-service-account-email "${RUNTIME_SERVICE_ACCOUNT}" \
                --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
                --headers "Content-Type=application/json" \
                --message-body "${body}"
            fi
          }

          deploy_migration_job
          deploy_background_job
          configure_background_iam
          configure_maintenance_scheduler
          deploy_api_service
